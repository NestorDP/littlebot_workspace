
name: Research
description: Investigate a technical question or evaluate an engineering alternative.
title: "[RESEARCH] "
labels: ["research"]
body:
  - type: markdown
    attributes:
      value: |
        Define a technical question and the expected outcome of the investigation.

  - type: textarea
    id: question
    attributes:
      label: Research question
      description: What question should this investigation answer?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Background and motivation
      description: Explain the technical context and why the investigation matters.
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: Hypothesis or initial assumptions
      description: What do you expect to find? Leave blank if no hypothesis is applicable.
    validations:
      required: false

  - type: textarea
    id: methodology
    attributes:
      label: Proposed methodology
      description: Describe the experiments, analysis, comparisons, or references to investigate.
    validations:
      required: true

  - type: textarea
    id: evaluation
    attributes:
      label: Evaluation criteria
      description: What evidence or metrics will be used to evaluate the alternatives?
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: Expected deliverables
      description: Define the expected output, such as an experiment report, prototype, comparison, or technical recommendation.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References and related work
      description: Papers, documentation, related issues, or existing implementations.
    validations:
      required: false
